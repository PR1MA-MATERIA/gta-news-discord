name: GTA Newswire

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:

      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: デバッグ
        run: |
          python debug.py
          echo "===== HTML BEGIN ====="
          head -c 10000 rockstar.html
          echo ""
          echo "===== HTML END ====="
          
      - name: Newswireをチェック
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python newswire.py

      - name: 投稿状態を保存
        run: |

          if [ ! -f last_posted.json ]; then
            echo "last_posted.jsonが存在しないため保存処理をスキップします。"
            exit 0
          fi

          if git diff --quiet -- last_posted.json; then
            echo "状態に変更はありません。"
            exit 0
          fi

          git config user.name "GTA News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_posted.json
          git commit -m "Update Newswire state"
          git push
